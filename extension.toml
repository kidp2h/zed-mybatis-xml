id = "mybatis-xml"
name = "MyBatis XML"
description = "XML support with SQL highlighting inside MyBatis mapper files."
version = "0.2.0"
schema_version = 1
authors = ["sweetppro", "notpeter", "moilolon", "kidp2h"]
repository = "https://github.com/kidp2h/zed-mybatis-xml"

[grammars.xml]
repository = "https://github.com/tree-sitter-grammars/tree-sitter-xml"
commit = "5000ae8f22d11fbe93939b05c1e37cf21117162d"
path = "xml"

# Grammar lives in this repository; bump commit after changing it
[grammars.mybatis_sql]
repository = "https://github.com/kidp2h/zed-mybatis-xml"
commit = "3e5ec320f20500f8877e6376a75c60730f9cb94b"
path = "tree-sitter-mybatis-sql"

# Upstream: https://github.com/eclipse-lemminx/lemminx
# Binaries: https://github.com/redhat-developer/vscode-xml
[language_servers.lemminx]
name = "lemminx"
languages = ["XML"]
language_ids = { XML = "xml" }
